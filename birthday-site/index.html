<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1c0e13">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ff7c9c' d='M12 21s-7.5-4.7-10-9C.5 8.4 2 5 5.2 5c2 0 3.4 1 4.8 2.4C11.4 6 12.8 5 14.8 5 18 5 19.5 8.4 22 12c-2.5 4.3-10 9-10 9z'/%3E%3C/svg%3E">
<title>给小周的生日礼物</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    overflow: hidden;
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", "Source Han Sans SC", sans-serif;
    background: #140a0e;
  }
  button { font: inherit; }

  .entry-gate {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      linear-gradient(180deg, rgba(255, 214, 150, .06), transparent 45%),
      linear-gradient(155deg, #3a1422 0%, #261019 52%, #160b0f 100%);
    transition: opacity .7s ease, visibility .7s ease;
  }
  .entry-gate.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }
  .gate-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 34px 40px;
    border: 1px solid rgba(255, 215, 150, .28);
    border-radius: 18px;
    background: rgba(24, 9, 14, .82);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .5);
  }
  .gate-heart {
    font-size: 46px;
    line-height: 1;
    color: #ff7c9c;
    text-shadow: 0 0 30px rgba(255, 124, 156, .8);
    animation: heart-beat 1.6s ease-in-out infinite;
  }
  .gate-title {
    margin: 0;
    font-size: clamp(24px, 4vw, 38px);
    font-weight: 800;
    color: #ffe6a3;
    text-shadow: 0 3px 0 rgba(90, 40, 10, .45), 0 0 26px rgba(255, 214, 120, .5);
  }
  .gate-sub {
    margin: 0;
    font-size: 14px;
    letter-spacing: .14em;
    color: rgba(255, 235, 205, .8);
  }
  .gate-input {
    width: 160px;
    padding: 12px 16px;
    border: 1px solid rgba(255, 215, 150, .45);
    border-radius: 999px;
    background: rgba(255, 248, 235, .1);
    color: #ffe6a3;
    font-size: 20px;
    text-align: center;
    letter-spacing: .4em;
    outline: none;
  }
  .gate-input::placeholder { color: rgba(255, 230, 163, .35); letter-spacing: .2em; }
  .gate-input:focus { border-color: #ffd98a; box-shadow: 0 0 0 3px rgba(255, 217, 138, .18); }
  .gate-btn {
    padding: 10px 34px;
    border: 1px solid rgba(255, 215, 150, .5);
    border-radius: 999px;
    background: linear-gradient(180deg, #ffd98a, #e6a33f);
    color: #4a2608;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .14em;
    cursor: pointer;
  }
  .gate-btn:hover { filter: brightness(1.08); }
  .gate-error {
    margin: 0;
    font-size: 13px;
    color: #ff9db4;
    opacity: 0;
    transition: opacity .4s ease;
  }
  .gate-error.show { opacity: 1; }
  .gate-codes { display: flex; gap: 10px; }
  .gate-code {
    width: 52px;
    height: 56px;
    border: 1px solid rgba(255, 215, 150, .45);
    border-radius: 12px;
    background: rgba(255, 248, 235, .1);
    color: #ffe6a3;
    font-size: 24px;
    text-align: center;
    outline: none;
  }
  .gate-code:focus { border-color: #ffd98a; box-shadow: 0 0 0 3px rgba(255, 217, 138, .18); }

  .stage { position: fixed; inset: 0; overflow: hidden; }

  .scene {
    position: absolute;
    inset: 0;
    opacity: 0;
    visibility: hidden;
    transform: scale(1.03);
    pointer-events: none;
    transition: opacity .7s ease, transform .7s ease, visibility .7s;
  }
  .stage.scene-cake .scene-cake,
  .stage.scene-greeting .scene-greeting,
  .stage.scene-photos .scene-photos,
  .stage.scene-letter .scene-letter,
  .stage.scene-ending .scene-ending {
    opacity: 1;
    visibility: visible;
    transform: none;
    pointer-events: auto;
  }

  /* ---------- 蛋糕 ---------- */
  .scene-cake {
    background:
      linear-gradient(180deg, rgba(255, 214, 150, .055), transparent 42%),
      linear-gradient(155deg, #341420 0%, #251019 48%, #160b0f 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .beam {
    position: absolute;
    top: -8%;
    left: 50%;
    width: 76vw;
    height: 62vh;
    transform: translateX(-50%) rotate(7deg);
    background: linear-gradient(180deg, rgba(255, 216, 150, .09), transparent 72%);
    filter: blur(18px);
    pointer-events: none;
  }
  .cake-stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: min(96vw, 880px);
    perspective: 1200px;
  }
  .cake-3d {
    width: 100%;
    transform-style: preserve-3d;
    animation: cake-sway 10s ease-in-out infinite;
    will-change: transform;
  }
  .cake-float {
    width: 100%;
    display: flex;
    justify-content: center;
    animation: cake-float 6s ease-in-out infinite;
  }
  .cake-vortex {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 640px;
    height: 640px;
    margin: -320px 0 0 -320px;
    pointer-events: none;
    z-index: 0;
    animation: vortex-spin 45s linear infinite;
  }
  .vortex-star {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--c);
    box-shadow: 0 0 10px var(--c);
    opacity: .65;
  }
  @keyframes vortex-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .cake-art {
    display: block;
    width: min(100%, 76vh);
    height: auto;
    max-width: 100%;
    filter: drop-shadow(0 24px 26px rgba(20, 5, 10, .42));
  }
  .cake-stack {
    position: relative;
    width: 100%;
    transform-style: preserve-3d;
    display: none;
  }
  .cake-stack .cake-art.clone {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: auto;
  }
  .tier {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-style: preserve-3d;
  }
  .face {
    position: absolute;
    left: 50%;
    top: 50%;
    backface-visibility: visible;
  }
  .disc {
    position: absolute;
    left: 50%;
    top: 50%;
    border-radius: 50%;
  }
  .candle {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-style: preserve-3d;
  }
  .candle-face {
    position: absolute;
    left: 50%;
    top: 50%;
  }
  .flame {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 14px;
    height: 20px;
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: radial-gradient(circle at 50% 65%, #fff8d8, #ffd44d 45%, #ff8f3d);
    animation: flicker 1.1s ease-in-out infinite;
  }
  .topper {
    position: absolute;
    left: 50%;
    top: 50%;
    color: #ffe6a3;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 46px;
    font-weight: 800;
    text-align: center;
    white-space: nowrap;
    text-shadow: 0 2px 0 rgba(90, 40, 10, .45), 0 6px 14px rgba(0, 0, 0, .4);
  }
  .scene-cake .cake-art { width: min(100%, 86vh); }
  #cakeSvg .flame,
  #cakeSvg .glow {
    transition: opacity .7s ease, transform .7s ease;
  }
  #cakeSvg.blown .flame {
    opacity: 0;
    transform: scale(.1);
    animation: none;
  }
  #cakeSvg.blown .glow {
    opacity: 0;
    transform: scale(.2);
    animation: none;
  }
  .wish-prompt {
    position: absolute;
    top: 8%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    color: rgba(255, 230, 180, .95);
    font-size: clamp(18px, 3.2vw, 28px);
    letter-spacing: .14em;
    text-shadow: 0 2px 14px rgba(0, 0, 0, .5);
    pointer-events: none;
    white-space: nowrap;
    transition: opacity .6s ease;
  }
  .scene-cake.bursting .cake-stage {
    opacity: .08;
    filter: blur(10px) brightness(.4);
    transform: scale(.9);
    transition: opacity .7s ease, filter .7s ease, transform .7s ease;
  }
  .scene-cake.bursting .beam,
  .scene-cake.bursting .wish-prompt { opacity: 0; }
  .scene-cake.wished {
    background:
      radial-gradient(circle at 50% 46%, rgba(255, 208, 128, .13), transparent 48%),
      linear-gradient(180deg, rgba(255, 214, 150, .055), transparent 42%),
      linear-gradient(155deg, #341420 0%, #251019 48%, #160b0f 100%);
  }
  .scene-cake.wished .beam { opacity: 1; }
  .scene-cake.wished #cakeSvg {
    filter: drop-shadow(0 24px 26px rgba(20, 5, 10, .42)) drop-shadow(0 0 30px rgba(255, 200, 110, .34));
  }
  .scene-cake.wished .cake-float { animation-duration: 4.6s; }
  .scene-cake.wished .cake-3d { animation-duration: 7s; }
  .wish-embrace {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1s ease;
  }
  .scene-cake.wished .wish-embrace { opacity: 1; }
  .wish-aura {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(92vw, 820px);
    aspect-ratio: 1;
    transform: translate(-50%, -50%) scale(.94);
    border-radius: 50%;
    background: radial-gradient(circle at 50% 52%, transparent 34%, rgba(255, 208, 128, .10) 52%, rgba(255, 172, 92, .2) 66%, transparent 78%);
    filter: blur(2px);
    animation: aura-breathe 4.2s ease-in-out infinite;
  }
  .wish-ember,
  .wish-star {
    position: absolute;
    left: var(--x);
    top: var(--y);
    opacity: 0;
  }
  .wish-ember {
    width: var(--s);
    height: var(--s);
    border-radius: 50%;
    background: var(--c);
    box-shadow: 0 0 10px var(--c);
    animation: ember-rise var(--d) ease-out var(--delay) infinite;
  }
  .wish-star {
    font-size: var(--s);
    line-height: 1;
    color: var(--c);
    text-shadow: 0 0 12px var(--c);
    animation: star-float var(--d) ease-out var(--delay) infinite;
  }
  .wish-burst {
    position: absolute;
    inset: 0;
    z-index: 12;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    opacity: 0;
    transition: opacity .5s ease;
  }
  .wish-burst.show { opacity: 1; }
  .wish-flash {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255, 248, 220, .95), rgba(255, 200, 120, .5) 34%, transparent 72%);
    animation: flash-fade 1.1s ease forwards;
  }
  .wish-ring {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 40px;
    height: 40px;
    border: 4px solid rgba(255, 222, 140, .95);
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
    animation: ring-out 1.2s cubic-bezier(.1, .8, .2, 1) forwards;
  }
  .wish-ring.ring-2 {
    animation-delay: .18s;
    border-color: rgba(255, 255, 255, .8);
  }
  .wish-text {
    position: relative;
    margin: 0;
    font-size: clamp(38px, 8vw, 92px);
    font-weight: 800;
    letter-spacing: .08em;
    color: #ffe9b0;
    text-shadow:
      0 0 24px rgba(255, 216, 125, .95),
      0 0 70px rgba(255, 165, 190, .55),
      0 4px 0 rgba(90, 40, 10, .5);
    animation: title-glow 3s ease-in-out infinite;
  }
  .wish-text span {
    display: inline-block;
    opacity: 0;
    animation: wish-letter .7s cubic-bezier(.2, .9, .3, 1.35) both;
    animation-delay: calc(.15s + var(--i) * .12s);
  }
  .burst-particles {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 0;
    height: 0;
  }
  .burst-p {
    position: absolute;
    left: 0;
    top: 0;
    font-size: var(--s);
    color: var(--c);
    opacity: 0;
    animation: burst-fly 1.6s cubic-bezier(.1, .8, .2, 1) forwards;
  }
  .burst-p.dot {
    width: var(--s);
    height: var(--s);
    border-radius: 50%;
    background: var(--c);
    box-shadow: 0 0 14px var(--c);
  }
  @keyframes flash-fade {
    from { opacity: 1; }
    to { opacity: 0; }
  }
  @keyframes ring-out {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(.2); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(9); }
  }
  @keyframes wish-letter {
    from { opacity: 0; transform: translateY(34px) scale(.3); }
    60% { transform: translateY(-8px) scale(1.12); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes burst-fly {
    0% { opacity: 1; transform: translate(0, 0) scale(1); }
    100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(.4); }
  }
  @keyframes aura-breathe {
    0%, 100% { opacity: .6; transform: translate(-50%, -50%) scale(.94); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.02); }
  }
  @keyframes ember-rise {
    0% { opacity: 0; transform: translate(0, 0) scale(.4); }
    16% { opacity: .95; }
    100% { opacity: 0; transform: translate(var(--sway), -48vh) scale(1); }
  }
  @keyframes star-float {
    0% { opacity: 0; transform: translate(0, 0) rotate(0deg) scale(.4); }
    20% { opacity: 1; }
    80% { opacity: .7; }
    100% { opacity: 0; transform: translate(var(--sway), -54vh) rotate(90deg) scale(1.05); }
  }
  .flame {
    transform-origin: 50% 100%;
    transform-box: fill-box;
    animation: flicker 1.1s ease-in-out infinite;
  }
  .glow {
    transform-origin: 50% 100%;
    transform-box: fill-box;
    animation: glow-pulse 1.6s ease-in-out infinite;
  }
  .smoke {
    transform-origin: 50% 100%;
    transform-box: fill-box;
    opacity: 0;
    animation: smoke-rise 3.4s ease-out infinite;
  }
  .spark {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--s);
    height: var(--s);
    background: #ffe1a3;
    transform: rotate(45deg);
    border-radius: 1px;
    opacity: 0;
    animation: sparkle var(--d) ease-in-out infinite;
    pointer-events: none;
  }

  /* ---------- 生日快乐 ---------- */
  .ambient-particles {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    overflow: hidden;
  }
  .ambient-particle {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--s);
    height: var(--s);
    border-radius: 50%;
    background: var(--c);
    opacity: 0;
    box-shadow: 0 0 8px var(--c);
    animation: particle-drift var(--d) ease-in-out var(--delay) infinite;
  }
  @keyframes particle-drift {
    0%, 100% { opacity: 0; transform: translateY(0) translateX(0) scale(.6); }
    18% { opacity: var(--o); }
    50% { transform: translateY(-22px) translateX(var(--sw)) scale(1); }
    82% { opacity: var(--o); }
  }
  .scene-greeting {
    background:
      linear-gradient(180deg, rgba(255, 214, 150, .07), transparent 46%),
      linear-gradient(155deg, #3a1422 0%, #261019 50%, #160b0f 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .greeting-core {
    position: relative;
    z-index: 5;
    text-align: center;
    padding: 34px 46px;
    border-radius: 22px;
    border: 1px solid rgba(255, 215, 150, .26);
    background: rgba(18, 7, 11, .84);
    box-shadow: 0 30px 70px rgba(0, 0, 0, .46);
  }
  .title {
    margin: 0;
    white-space: nowrap;
    font-size: clamp(64px, 14vw, 168px);
    font-weight: 700;
    line-height: 1.1;
    letter-spacing: .02em;
    color: #ffd98a;
    text-shadow:
      0 0 18px rgba(255, 214, 130, .6),
      0 0 46px rgba(255, 160, 185, .38),
      0 4px 0 rgba(82, 26, 30, .42);
    animation: title-glow 3s ease-in-out infinite;
  }
  .letter { display: inline-block; opacity: 0; }
  .stage.scene-greeting .letter {
    opacity: 1;
    animation: letter-in .5s cubic-bezier(.25, .8, .35, 1) backwards;
    animation-delay: calc(.12s + var(--i) * .07s);
  }
  .subtitle {
    margin: 22px 0 0;
    white-space: nowrap;
    color: rgba(255, 232, 190, .9);
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(14px, 2.4vw, 22px);
    letter-spacing: .42em;
    text-indent: .42em;
    opacity: 0;
  }
  .stage.scene-greeting .subtitle {
    opacity: 1;
    animation: fade-in .7s .6s ease backwards;
  }
  .hearts,
  .confetti {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }
  .heart {
    position: absolute;
    left: 50%;
    top: 50%;
    color: #ff7c9c;
    font-size: 20px;
    opacity: 0;
  }
  .stage.scene-greeting .heart {
    animation: heart-burst 1.8s cubic-bezier(.2, .8, .25, 1) both;
    animation-delay: var(--d);
  }
  .confetti i {
    position: absolute;
    top: -8%;
    left: var(--x);
    width: 9px;
    height: 14px;
    background: var(--c);
    border-radius: 2px;
    opacity: 0;
    animation: confetti-fall 3.8s linear var(--d) infinite;
  }
  #cakeConfetti i {
    animation: confetti-fall 3.8s linear var(--d) forwards;
    will-change: transform, opacity;
  }

  /* ---------- 照片墙 ---------- */
  .scene-photos {
    background:
      linear-gradient(180deg, rgba(255, 214, 150, .05), transparent 40%),
      linear-gradient(155deg, #241019 0%, #170c10 55%, #0e080b 100%);
  }
  .floating-hearts {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 1;
  }
  .heart-float {
    position: absolute;
    bottom: -10vh;
    left: var(--x);
    color: var(--hc);
    font-size: var(--hs);
    line-height: 1;
    text-shadow: 0 0 14px currentColor;
    opacity: 0;
    animation: heart-rise var(--hd) linear var(--hd2) infinite;
    will-change: transform, opacity;
  }
  @keyframes heart-rise {
    0% { opacity: 0; transform: translateY(0) translateX(0) rotate(-8deg) scale(.7); }
    8% { opacity: var(--ho); }
    50% { transform: translateY(-52vh) translateX(var(--sw)) rotate(10deg) scale(1); }
    92% { opacity: var(--ho); }
    100% { opacity: 0; transform: translateY(-118vh) translateX(calc(var(--sw) * -1)) rotate(-6deg) scale(1.06); }
  }
  .photo-wall {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: clamp(8px, 1vw, 14px);
    padding: clamp(10px, 1.5vw, 24px);
    overflow: hidden;
  }
  .photos-flash {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: radial-gradient(circle at 50% 50%, #fff 0%, rgba(255, 214, 150, .85) 45%, transparent 78%);
    opacity: 0;
  }
  .stage.scene-photos .photos-flash { animation: photos-flash 1.1s ease-out both; }
  @keyframes photos-flash {
    0% { opacity: 1; }
    100% { opacity: 0; }
  }
  .photo {
    --r: 0deg;
    --t: 0px;
    position: relative;
    width: 100%;
    height: 100%;
    appearance: none;
    border: 0;
    cursor: zoom-in;
    display: flex;
    flex-direction: column;
    text-align: left;
    background: #fdf7eb;
    padding: 6px 6px 12px;
    border-radius: 5px;
    box-shadow: 0 16px 32px rgba(8, 3, 6, .45);
    transform: rotate(var(--r)) translateY(var(--t));
    opacity: 0;
    transition: transform .35s ease, box-shadow .35s ease;
  }
  .stage.scene-photos .photo {
    opacity: 1;
    animation: photo-in 1.15s cubic-bezier(.2, .85, .25, 1.14) backwards;
    animation-delay: calc(.3s + var(--i) * 70ms);
  }
  .photo:hover {
    transform: rotate(0deg) translateY(-8px) scale(1.04);
    box-shadow: 0 26px 46px rgba(8, 3, 6, .56);
    z-index: 6;
  }
  .photo:focus-visible { outline: 3px solid #ffd98a; outline-offset: 3px; }
  .pic {
    position: relative;
    flex: 1;
    min-height: 0;
    width: 100%;
    background: #efe5d2;
    border-radius: 3px;
    overflow: hidden;
  }
  .pic img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 1;
  }

  .replay {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 46px;
    height: 46px;
    border: 1px solid rgba(255, 255, 255, .3);
    border-radius: 50%;
    background: rgba(255, 255, 255, .1);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 8;

<script>
  const stage = document.getElementById('stage');
  const bgm = document.getElementById('bgm');
  const musicBtn = document.getElementById('musicBtn');
  let musicStarted = false;
  bgm.addEventListener('error', () => {
    musicStarted = false;
    musicBtn.classList.remove('playing');
  });
  function startMusic() {
    if (musicStarted || !bgm) return;
    musicStarted = true;
    const p = bgm.play();
    if (p) {
      p.then(() => musicBtn.classList.add('playing')).catch(() => {
        musicStarted = false;
        const unlock = () => {
          document.removeEventListener('pointerdown', unlock);
          document.removeEventListener('touchstart', unlock);
          bgm.play().then(() => {
            musicStarted = true;
            musicBtn.classList.add('playing');
          }).catch(() => {});
        };
        document.addEventListener('pointerdown', unlock);
        document.addEventListener('touchstart', unlock);
      });
    } else {
      musicBtn.classList.add('playing');
    }
  }
  let bgmFadeRaf = null;
  function fadeBgm(target) {
    if (bgmFadeRaf) cancelAnimationFrame(bgmFadeRaf);
    const from = bgm.volume;
    const start = performance.now();
    const dur = 4000;
    const step = (t) => {
      const k = Math.min(1, (t - start) / dur);
      bgm.volume = from + (target - from) * k;
      if (k < 1) bgmFadeRaf = requestAnimationFrame(step);
      else bgmFadeRaf = null;
    };
    bgmFadeRaf = requestAnimationFrame(step);
  }
  function blowCandles() {
    if (candlesBlown || !cakeSvg) return;
    candlesBlown = true;
    cakeSvg.classList.add('blown');
    if (cakeScene) cakeScene.classList.add('bursting');
    if (wishPrompt) wishPrompt.style.opacity = 0;
    if (wishBurst) wishBurst.classList.add('show');
    wishBurstOpen = true;
    window.setTimeout(() => launchCakeConfetti(), 550);
    if (burstParticles && burstParticles.children.length === 0) {
      const colors = ['#ffd98a', '#ff8fa3', '#ffb37d', '#fff0d0', '#ffc3cf', '#ffe6a3'];
      for (let i = 0; i < 56; i++) {
        const p = document.createElement('span');
        p.className = 'burst-p' + (i % 4 === 3 ? ' dot' : '');
        const a = (i / 56) * Math.PI * 2 + Math.random() * 0.4;
        const dist = 130 + Math.random() * 320;
        p.style.setProperty('--tx', `${Math.cos(a) * dist}px`);
        p.style.setProperty('--ty', `${Math.sin(a) * dist}px`);
        p.style.setProperty('--c', colors[i % colors.length]);
        p.style.setProperty('--s', `${12 + Math.random() * 14}px`);
        if (i % 4 !== 3) p.textContent = ['♥', '✦', '✧'][i % 3];
        p.style.animationDelay = `${Math.random() * 0.25}s`;
        burstParticles.appendChild(p);
      }
    }
    createWishGlow();
    window.setTimeout(() => {
      if (wishBurst) wishBurst.classList.remove('show');
      if (cakeScene) {
        cakeScene.classList.remove('bursting');
        cakeScene.classList.add('wished');
      }
      wishBurstOpen = false;
    }, 3400);
  }
  function resetWishGlow() {
    const box = document.getElementById('wishEmbrace');
    if (!box) return;
    box.innerHTML = '';
    delete box.dataset.ready;
  }
  function createWishGlow() {
    const box = document.getElementById('wishEmbrace');
    if (!box || box.dataset.ready) return;
    box.dataset.ready = '1';
    const aura = document.createElement('div');
    aura.className = 'wish-aura';
    box.appendChild(aura);
    const colors = ['#ffe6a3', '#ffd98a', '#ffc3cf', '#8fd3c7', '#fff0d0', '#ffb37d'];
    for (let i = 0; i < 18; i++) {
      const s = document.createElement('span');
      s.className = i % 4 === 0 ? 'wish-star' : 'wish-ember';
      s.style.setProperty('--x', `${12 + Math.random() * 76}%`);
      s.style.setProperty('--y', `${46 + Math.random() * 24}%`);
      s.style.setProperty('--s', `${(i % 4 === 0 ? 13 : 6) + Math.random() * 7}px`);
      s.style.setProperty('--c', colors[i % colors.length]);
      s.style.setProperty('--d', `${3.6 + Math.random() * 3.4}s`);
      s.style.setProperty('--delay', `${Math.random() * 3}s`);
      s.style.setProperty('--sway', `${Math.round(Math.random() * 140 - 70)}px`);
      if (i % 4 === 0) s.textContent = '✦';
      box.appendChild(s);
    }
  }
  function spawnTapSpark(x, y) {
    const s = document.createElement('span');
    s.className = 'tap-spark';
    const glyphs = ['♥', '✦', '✧', '❤'];
    s.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];
    const colors = ['#ffd98a', '#ff8fa3', '#ffb37d', '#fff0d0'];
    s.style.left = `${x}px`;
    s.style.top = `${y}px`;
    s.style.setProperty('--s', `${14 + Math.random() * 10}px`);
    s.style.setProperty('--c', colors[Math.floor(Math.random() * colors.length)]);
    document.body.appendChild(s);
    window.setTimeout(() => s.remove(), 1200);
  }
  function launchCakeConfetti() {
    const box = document.getElementById('cakeConfetti');
    if (!box) return;
    const colors = ['#ffd98a', '#ff8fa3', '#ffb37d', '#fff0d0', '#8fd3c7', '#ffc3cf'];
    for (let i = 0; i < 30; i++) {
      const c = document.createElement('i');
      c.style.setProperty('--x', `${Math.random() * 100}%`);
      c.style.setProperty('--d', `${Math.random() * 2}s`);
      c.style.setProperty('--c', colors[i % colors.length]);
      box.appendChild(c);
      c.addEventListener('animationend', () => c.remove(), { once: true });
    }
  }
  const PHOTOS = Array.from({ length: 15 }, (_, i) => i + 1);
  const ASSET_VERSION = '4';
  const thumb = (n) => `thumbs/${n}.jpg?v=${ASSET_VERSION}`;
  const full = (n) => `view/${n}.jpg?v=${ASSET_VERSION}`;
  const lightboxSrc = (n) => (window.matchMedia('(max-width: 760px)').matches ? `mobile/${n}.jpg?v=${ASSET_VERSION}` : full(n));
  let thumbPreloads = [[], []];
  function preloadThumbs(page = 0) {
    const list = PHOTOS.slice(page * 8, page * 8 + 8);
    const cache = thumbPreloads[page];
    list.forEach((n, idx) => {
      if (cache[idx]) return;
      const img = new Image();
      img.src = thumb(n);
      cache[idx] = img;
    });
  }
  function preloadLightbox(i) {
    [i - 1, i, i + 1].forEach((idx) => {
      const img = new Image();
      img.src = lightboxSrc(PHOTOS[(idx + PHOTOS.length) % PHOTOS.length]);
    });
  }

  const cakeStage = document.getElementById('cakeStage');
  const cakeScene = document.getElementById('cakeScene');
  const cakeSvg = document.getElementById('cakeSvg');
  const wishPrompt = document.getElementById('wishPrompt');
  const wishBurst = document.getElementById('wishBurst');
  const burstParticles = document.getElementById('burstParticles');
  let candlesBlown = false;
  let wishBurstOpen = false;

  const entryGate = document.getElementById('entryGate');
  const gateCodes = [...document.querySelectorAll('#gateCodes .gate-code')];
  const gateBtn = document.getElementById('gateBtn');
  const gateError = document.getElementById('gateError');
  let gateOpened = false;
  let gateOpenedAt = 0;
  function tryEnter() {
    if (gateOpened) return;
    if (gateCodes.map((i) => i.value).join('') === '0705') {
      gateOpened = true;
      gateOpenedAt = performance.now();
      entryGate.classList.add('hide');
      startMusic();
      preloadThumbs(0);
      preloadThumbs(1);
      const voice = document.getElementById('voiceMsg');
      if (voice) voice.load();
    } else {
      gateError.classList.add('show');
      gateCodes.forEach((i) => { i.value = ''; });
      gateCodes[0].focus();
    }
  }
  gateBtn.addEventListener('click', tryEnter);
  gateCodes.forEach((input, idx) => {
    input.addEventListener('input', () => {
      gateError.classList.remove('show');
      if (input.value && idx < 3) gateCodes[idx + 1].focus();
    });
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') tryEnter();
      if (e.key === 'Backspace' && !input.value && idx > 0) gateCodes[idx - 1].focus();
    });
  });
  const sparkColors = ['#ffe1a3', '#ffd98a', '#ffc3cf', '#fff4d6', '#ffb37d'];
  for (let i = 0; i < 16; i++) {
    const s = document.createElement('span');
    s.className = 'spark';
    s.style.setProperty('--x', `${8 + Math.random() * 84}%`);
    s.style.setProperty('--y', `${10 + Math.random() * 78}%`);
    s.style.setProperty('--s', `${4 + Math.random() * 6}px`);
    s.style.setProperty('--d', `${1.6 + Math.random() * 2.4}s`);
    s.style.background = sparkColors[i % sparkColors.length];
    cakeStage.appendChild(s);
  }
  function createCakeVortex() {
    const box = document.getElementById('cakeVortex');
    if (!box) return;
    const colors = ['#ffd98a', '#ffc3cf', '#ffe6a3', '#ffb37d'];
    for (let i = 0; i < 26; i++) {
      const s = document.createElement('span');
      s.className = 'vortex-star';
      const a = (i / 26) * 360;
      const r = 150 + (i % 3) * 55;
      s.style.transform = `rotate(${a}deg) translateX(${r}px)`;
      s.style.setProperty('--c', colors[i % colors.length]);
      box.appendChild(s);
    }
  }
  createCakeVortex();

  const hearts = document.getElementById('hearts');
  for (let i = 0; i < 10; i++) {
    const h = document.createElement('span');
    h.className = 'heart';
    h.textContent = '♥';
    const angle = (i / 10) * Math.PI * 2;
    const dist = 120 + (i % 3) * 50;
    h.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
    h.style.setProperty('--ty', `${Math.sin(angle) * dist - 30}px`);
    h.style.setProperty('--d', `${i * 0.08}s`);
    hearts.appendChild(h);
  }

  const confetti = document.getElementById('confetti');
  const confettiColors = ['#ffd98a', '#ff8fa3', '#ffb37d', '#fff0d0', '#8fd3c7', '#ffc3cf'];
  for (let i = 0; i < 22; i++) {
    const c = document.createElement('i');
    c.style.setProperty('--x', `${Math.random() * 100}%`);
    c.style.setProperty('--d', `${Math.random() * 3}s`);
    c.style.setProperty('--c', confettiColors[i % confettiColors.length]);
    confetti.appendChild(c);
  }

  const cakeCanvas = null;
  let cakeParticles = [];
  let cakeCtx = null;
  let cakeSize = 0;
  let cakeDPR = 1;

  function shade(base, amt) {
    return [
      Math.max(0, Math.min(255, Math.round(base[0] + amt))),
      Math.max(0, Math.min(255, Math.round(base[1] + amt))),
      Math.max(0, Math.min(255, Math.round(base[2] + amt)))
    ];
  }
  function fillCylinder(list, radius, yTop, yBottom, palette, count) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const rr = Math.sqrt(Math.random()) * radius;
      const y = yBottom + Math.random() * (yTop - yBottom);
      const base = palette[Math.floor(Math.random() * palette.length)];
      list.push({
        x: Math.cos(a) * rr,
        y,
        z: Math.sin(a) * rr,
        r: 2.1,
        c: shade(base, Math.floor(Math.random() * 22) - 11),
        a: 0.85,
        tw: 0,
        frontOnly: false,
        rad: 0
      });
    }
  }
  function makeCakeParticles() {
    const parts = [];
    const mobile = window.innerWidth < 760;
    const s = mobile ? 0.55 : 1;
    fillCylinder(parts, 150, -70, 30, [[255, 201, 218], [246, 173, 198], [224, 127, 159]], Math.round(900 * s));
    fillCylinder(parts, 112, 30, 110, [[255, 236, 196], [242, 205, 143], [220, 171, 99]], Math.round(720 * s));
    fillCylinder(parts, 74, 110, 182, [[255, 214, 228], [243, 169, 196], [222, 125, 164]], Math.round(520 * s));
    for (let i = 0; i < Math.round(320 * s); i++) {
      const a = Math.random() * Math.PI * 2;
      const rr = Math.sqrt(Math.random()) * 190;
      parts.push({
        x: Math.cos(a) * rr, y: 40, z: Math.sin(a) * rr, r: 2.0,
        c: shade([250, 244, 230], Math.floor(Math.random() * 24) - 12),
        a: 0.7, tw: 0, frontOnly: false, rad: 0
      });
    }
    const candleColors = [[255, 159, 122], [255, 217, 138], [255, 143, 163]];
    [-34, 0, 34].forEach((cx, ci) => {
      const base = candleColors[ci];
      for (let i = 0; i < Math.round(70 * s); i++) {
        const a = Math.random() * Math.PI * 2;
        const rr = Math.sqrt(Math.random()) * 9;
        parts.push({
          x: cx + Math.cos(a) * rr,
          y: 182 + Math.random() * 64,
          z: Math.sin(a) * rr,
          r: 1.7,
          c: shade(base, Math.floor(Math.random() * 18) - 9),
          a: 0.9, tw: 0, frontOnly: false, rad: 0
        });
      }
      for (let i = 0; i < Math.round(34 * s); i++) {
        const a = Math.random() * Math.PI * 2;
        const rr = Math.random() * 6;
        parts.push({
          x: cx + Math.cos(a) * rr * 0.7,
          y: 250 + Math.random() * 18,
          z: Math.sin(a) * rr * 0.7,
          r: 1.7,
          c: [255, 222, 120],
          a: 0.95,
          tw: Math.random() * 6.28,
          frontOnly: false,
          rad: 0
        });
      }
    });
    const tmp = document.createElement('canvas');
    tmp.width = 420;
    tmp.height = 220;
    const tc = tmp.getContext('2d');
    tc.font = '800 150px Georgia, "Times New Roman", serif';
    tc.textAlign = 'center';
    tc.textBaseline = 'middle';
    tc.fillStyle = '#fff';
    tc.fillText('22', 210, 118);
    const data = tc.getImageData(0, 0, 420, 220).data;
    const gold = [[255, 214, 140], [255, 232, 180], [240, 190, 90]];
    let count = 0;
    for (let py = 0; py < 220 && count < 260; py += 4) {
      for (let px = 0; px < 420; px += 4) {
        if (data[(py * 420 + px) * 4 + 3] > 120) {
          const x = (px / 420 - 0.5) * 170;
          const y = 70 + (py / 220 - 0.5) * 90;
          const base = gold[Math.floor(Math.random() * gold.length)];
          parts.push({
            x, y, z: 113.5, r: 2.4,
            c: shade(base, Math.floor(Math.random() * 18) - 9),
            a: 0.98, tw: 0, frontOnly: true, rad: 112
          });
          count++;
        }
      }
    }
    for (let i = 0; i < Math.round(120 * s); i++) {
      const a = Math.random() * Math.PI * 2;
      const rr = Math.random() * 3;
      parts.push({
        x: Math.cos(a) * rr,
        y: Math.random() * 80 - 40,
        z: Math.sin(a) * rr,
        r: 1.4,
        c: [255, 240, 200],
        a: 0.35,
        tw: Math.random() * 6.28,
        frontOnly: false,
        rad: 0
      });
    }
    return parts;
  }
  function resizeCake() {
    if (!cakeCanvas) return;
    cakeDPR = window.devicePixelRatio || 1;
    const rect = cakeCanvas.getBoundingClientRect();
    cakeSize = Math.max(100, Math.min(rect.width, rect.height));
    cakeCanvas.width = Math.round(cakeSize * cakeDPR);
    cakeCanvas.height = Math.round(cakeSize * cakeDPR);
    cakeCtx = cakeCanvas.getContext('2d');
    cakeCtx.setTransform(cakeDPR, 0, 0, cakeDPR, 0, 0);
  }
  function drawCake(now) {
    if (!cakeCtx || cakeSize < 1) return;
    const t = now / 1000;
    const ang = t * 0.55;
    const tilt = -0.3;
    const cosA = Math.cos(ang), sinA = Math.sin(ang);
    const cosT = Math.cos(tilt), sinT = Math.sin(tilt);
    const cx = cakeSize / 2, cy = cakeSize / 2;
    const unit = cakeSize / 460;
    const FOV = 900 * unit;
    const parts = cakeParticles;
    const order = parts.map((_, i) => i);
    const depths = new Float32Array(parts.length);
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      const xr = p.x * cosA + p.z * sinA;
      const zr = -p.x * sinA + p.z * cosA;
      const yr = p.y * cosT - zr * sinT;
      const z2 = p.y * sinT + zr * cosT;
      p._xr = xr; p._yr = yr; p._z2 = z2;
      depths[i] = z2;
    }
    order.sort((a, b) => depths[b] - depths[a]);
    cakeCtx.clearRect(0, 0, cakeSize, cakeSize);
    for (let i = 0; i < order.length; i++) {
      const p = parts[order[i]];
      const persp = FOV / (FOV + p._z2);
      const sx = cx + p._xr * persp * unit;
      const sy = cy - p._yr * persp * unit;
      let alpha = p.a;
      if (p.frontOnly && p.rad) alpha *= Math.max(0.05, p._xr / p.rad);
      if (p.tw) alpha *= 0.55 + 0.45 * Math.sin(t * 3 + p.tw);
      const sz = Math.max(0.4, p.r * persp * unit);
      cakeCtx.beginPath();
      cakeCtx.arc(sx, sy, sz, 0, Math.PI * 2);
      cakeCtx.fillStyle = `rgba(${p.c[0]},${p.c[1]},${p.c[2]},${Math.min(1, Math.max(0, alpha))})`;
      cakeCtx.fill();
    }
    requestAnimationFrame(drawCake);
  }
  function startCake() {
    cakeParticles = makeCakeParticles();
    resizeCake();
    requestAnimationFrame(drawCake);
  }
  window.addEventListener('resize', resizeCake);
  startCake();

  function createFloatingHearts(container, count) {
    const heartColors = ['#ff8fa3', '#ffb3c1', '#ffd98a', '#ff7c9c', '#ffc3cf'];
    for (let i = 0; i < count; i++) {
      const h = document.createElement('span');
      h.className = 'heart-float';
      h.textContent = '♥';
      h.style.setProperty('--x', `${Math.random() * 100}%`);
      h.style.setProperty('--hs', `${16 + Math.random() * 22}px`);
      h.style.setProperty('--hd', `${7 + Math.random() * 8}s`);
      h.style.setProperty('--hd2', `${-Math.random() * 12}s`);
      h.style.setProperty('--ho', `${0.22 + Math.random() * 0.34}`);
      h.style.setProperty('--hc', heartColors[i % heartColors.length]);
      h.style.setProperty('--sw', `${(Math.random() * 70 - 35).toFixed(1)}px`);
      container.appendChild(h);
    }
  }
  createFloatingHearts(document.getElementById('floatingHearts'), 16);
  createFloatingHearts(document.getElementById('letterHearts'), 20);

  function createAmbientParticles() {
    const box = document.getElementById('ambientParticles');
    if (!box) return;
    const colors = ['#ffe6a3', '#ffc3cf', '#ffd98a', '#fff0d0', '#8fd3c7'];
    for (let i = 0; i < 18; i++) {
      const p = document.createElement('span');
      p.className = 'ambient-particle';
      p.style.setProperty('--x', `${Math.random() * 100}%`);
      p.style.setProperty('--y', `${Math.random() * 100}%`);
      p.style.setProperty('--s', `${2 + Math.random() * 3}px`);
      p.style.setProperty('--c', colors[i % colors.length]);
      p.style.setProperty('--o', `${0.14 + Math.random() * 0.22}`);
      p.style.setProperty('--d', `${5 + Math.random() * 4}s`);
      p.style.setProperty('--delay', `${-Math.random() * 6}s`);
      p.style.setProperty('--sw', `${(Math.random() * 46 - 23).toFixed(1)}px`);
      box.appendChild(p);
    }
  }
  createAmbientParticles();

  const voiceBtn = document.getElementById('voiceBtn');
  const voiceLabel = document.getElementById('voiceLabel');
  const voiceMsg = document.getElementById('voiceMsg');
  const endingHeart = document.getElementById('endingHeart');
  const endingMessage = document.getElementById('endingMessage');
  const endingHint = document.getElementById('endingHint');
  const endingStars = document.getElementById('endingStars');
  const endingFireworks = document.getElementById('endingFireworks');
  const endingHeartRain = document.getElementById('endingHeartRain');

  if (endingStars) {
    const starColors = ['#ffd98a', '#ff8fa3', '#ffb37d', '#fff0d0', '#ffe6a3'];
    for (let i = 0; i < 26; i++) {
      const st = document.createElement('span');
      st.className = 'ending-star';
      st.textContent = ['✦', '✧', '♥'][i % 3];
      st.style.setProperty('--x', `${Math.random() * 100}%`);
      st.style.setProperty('--s', `${12 + Math.random() * 12}px`);
      st.style.setProperty('--c', starColors[i % starColors.length]);
      st.style.setProperty('--d', `${6 + Math.random() * 6}s`);
      st.style.setProperty('--delay', `${-Math.random() * 8}s`);
      endingStars.appendChild(st);
    }
  }
  if (endingHeartRain) {
    const heartRainColors = ['#ff8fa3', '#ffb3c1', '#ffd98a', '#ff7c9c', '#ffc3cf'];
    for (let i = 0; i < 22; i++) {
      const h = document.createElement('span');
      h.className = 'rain-heart';
      h.textContent = '♥';
      h.style.setProperty('--x', `${Math.random() * 100}%`);
      h.style.setProperty('--s', `${16 + Math.random() * 18}px`);
      h.style.setProperty('--c', heartRainColors[i % heartRainColors.length]);
      h.style.setProperty('--d', `${7 + Math.random() * 6}s`);
      h.style.setProperty('--delay', `${-Math.random() * 9}s`);
      endingHeartRain.appendChild(h);
    }
  }

  const letterLines = [...document.querySelectorAll('.letter-line')];
  const letterSign = document.querySelector('.letter-sign');
  const letterTexts = letterLines.map((l) => l.textContent);
  let letterTimer = null;
  let letterFast = false;
  let letterDone = false;
  let letterOpened = false;
  function startLetterTyping() {
    if (letterTimer) clearTimeout(letterTimer);
    letterFast = false;
    letterDone = false;
    letterLines.forEach((l) => {
      l.textContent = '';
      l.classList.remove('typing');
    });
    if (letterSign) letterSign.style.opacity = 0;
    let li = 0;
    let ci = 0;
    const step = () => {
      if (li >= letterLines.length) {
        if (letterSign) letterSign.style.opacity = 1;
        letterDone = true;
        return;
      }
      const line = letterLines[li];
      const full = letterTexts[li];
      if (ci < full.length) {
        line.textContent = full.slice(0, ci + 1);
        line.classList.add('typing');
        ci += 1;
        letterTimer = setTimeout(step, letterFast ? 12 : 85);
      } else {
        line.classList.remove('typing');
        ci = 0;
        li += 1;
        letterTimer = setTimeout(step, letterFast ? 60 : 420);
      }
    };
    letterTimer = setTimeout(step, 350);
  }
  function speedUpLetterTyping() {
    letterFast = true;
  }
  function resetLetterEnvelope() {
    const env = document.getElementById('letterEnvelope');
    if (env) env.classList.remove('open');
    letterOpened = false;
    if (letterTimer) clearTimeout(letterTimer);
    letterTimer = null;
    letterDone = false;
  }
  function openLetterEnvelope() {
    if (letterOpened) return;
    letterOpened = true;
    const env = document.getElementById('letterEnvelope');
    if (env) env.classList.add('open');
    window.setTimeout(() => startLetterTyping(), 650);
  }

  const rotations = [-3.2, 2.4, -1.6, 3, -2.1, 1.8, -3, 2.6, -2.4, 1.9, -2, 1.5, -2.8, 3.2, -1.4];
  const shifts = [0, 7, -5, 8, 2, -7, 6, -4, 9, -6, 3, -8, 5, 7, -3];
  const photoPage1 = document.getElementById('photoPage1');
  const photoPage2 = document.getElementById('photoPage2');
  const pagePrevBtn = document.getElementById('pagePrevBtn');
  const pageNextBtn = document.getElementById('pageNextBtn');
  const pageDots = document.getElementById('pageDots');
  const pageCount = document.getElementById('pageCount');
  const hintText = document.getElementById('hintText');
  let photoPage = 0;

  function renderPhotos(container, list, baseIndex) {
    container.innerHTML = list.map((n, i) => `
      <button class="photo" type="button" data-index="${baseIndex + i}" data-full="${full(n)}"
        style="--i:${i};--r:${rotations[i]}deg;--t:${shifts[i]}px"
        aria-label="照片 ${n}">
        <span class="pic"><img src="${thumb(n)}" alt="" decoding="async" loading="eager"></span>
      </button>`).join('');
    container.querySelectorAll('img').forEach((img) => {
      const mark = () => img.classList.add('loaded');
      if (img.complete && img.naturalWidth > 0) mark();
      else {
        img.addEventListener('load', mark, { once: true });
        img.addEventListener('error', mark, { once: true });
      }
    });
  }
  renderPhotos(photoPage1, PHOTOS.slice(0, 8), 0);
  renderPhotos(photoPage2, PHOTOS.slice(8), 8);

  function applyPhotoPage(next) {
    photoPage = next;
    photoPage1.classList.toggle('hidden', next !== 0);
    photoPage2.classList.toggle('hidden', next !== 1);
    pagePrevBtn.disabled = next === 0;
    pageNextBtn.disabled = next === 1;
    pageCount.textContent = `${next + 1} / 2`;
    pageDots.innerHTML = PHOTOS.slice(0, 2).map((_, i) =>
      `<button class="page-dot${i === next ? ' active' : ''}" data-page="${i}" type="button" aria-label="第 ${i + 1} 页"></button>`
    ).join('');
  }
  function showPhotoPage(next) {
    const page = next === 1 ? photoPage2 : photoPage1;
    page.querySelectorAll('img').forEach((img) => { img.loading = 'eager'; });
    preloadThumbs(next);
    applyPhotoPage(next);
  }
  showPhotoPage(0);

  const sceneNames = ['greeting', 'cake', 'letter', 'photos', 'ending'];
  let scene = 0;
  function setScene(next) {
    scene = next;
    stage.classList.remove(...sceneNames.map((n) => 'scene-' + n));
    stage.classList.add('scene-' + sceneNames[scene]);
    hintText.classList.remove('show');
    if (next === 0) {
      hintText.textContent = '开启礼物';
      candlesBlown = false;
      wishBurstOpen = false;
      if (cakeSvg) cakeSvg.classList.remove('blown');
      if (cakeScene) cakeScene.classList.remove('bursting', 'wished');
      resetWishGlow();
      resetLetterEnvelope();
      if (wishPrompt) wishPrompt.style.opacity = '';
      if (wishBurst) wishBurst.classList.remove('show');
    } else if (next === 1) {
      hintText.textContent = candlesBlown ? '轻触屏幕继续' : '许愿 · 点击蜡烛吹灭';
    } else if (next === 2) {
      hintText.textContent = '轻触屏幕继续';
    } else {
      hintText.textContent = '轻触屏幕';
    }
    if (scene === 2) {
      resetLetterEnvelope();
      preloadThumbs(1);
      if (voiceMsg) voiceMsg.load();
    }
    if (scene === 3) {
      preloadThumbs(0);
      preloadThumbs(1);
      showPhotoPage(0);
    }
    if (next === 4) fadeBgm(0.12);
    else fadeBgm(1);
  }

  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  let lightboxIndex = 0;
  function loadLightboxPhoto(i, step) {
    const paths = [lightboxSrc(i), full(i), thumb(i)];
    lightboxImg.onload = () => {
      lightboxImg.onerror = null;
      lightbox.classList.remove('loading');
    };
    lightboxImg.onerror = () => {
      if (step + 1 < paths.length) loadLightboxPhoto(i, step + 1);
      else {
        lightboxImg.onerror = null;
        lightbox.classList.remove('loading');
      }
    };
    lightboxImg.src = paths[step];
  }
  function openLightboxAt(i) {
    lightboxIndex = (i + PHOTOS.length) % PHOTOS.length;
    lightbox.classList.add('open', 'loading');
    loadLightboxPhoto(PHOTOS[lightboxIndex], 0);
    preloadLightbox(lightboxIndex);
  }
  function closeLightbox() {
    lightbox.classList.remove('open', 'loading');
    lightboxImg.onload = null;
    lightboxImg.onerror = null;
    lightboxImg.src = '';
  }

  [photoPage1, photoPage2].forEach((page) => {
    page.addEventListener('click', (e) => {
      const card = e.target.closest('.photo');
      if (card) openLightboxAt(Number(card.dataset.index));
    });
  });
  lightbox.addEventListener('click', (e) => {
    if (e.target === lightbox || e.target.closest('.close')) closeLightbox();
  });
  document.getElementById('lbPrev').addEventListener('click', (e) => {
    e.stopPropagation();
    openLightboxAt(lightboxIndex - 1);
  });
  document.getElementById('lbNext').addEventListener('click', (e) => {
    e.stopPropagation();
    openLightboxAt(lightboxIndex + 1);
  });

  pagePrevBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    showPhotoPage(0);
  });
  pageNextBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    showPhotoPage(1);
  });
  pageDots.addEventListener('click', (e) => {
    const dot = e.target.closest('.page-dot');
    if (dot) showPhotoPage(Number(dot.dataset.page));
  });

  document.getElementById('replayBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    setScene(0);
  });

  document.getElementById('endBackBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    setScene(0);
  });

  const isMobile = window.matchMedia('(max-width: 760px)').matches || 'ontouchstart' in window;
  function duckBgm() {
    bgm.volume = 0.12;
    if (!isMobile) {
      window.setTimeout(() => {
        if (musicBtn.classList.contains('playing') && bgm.paused) {
          bgm.play().catch(() => {});
        }
      }, 120);
    }
  }
  function resumeBgmIfNeeded() {
    bgm.volume = 1;
    if (musicBtn.classList.contains('playing') && bgm.paused) {
      bgm.play().catch(() => {});
    }
  }
  let voiceRetryTimer = null;
  function startVoicePlayback() {
    if (voiceRetryTimer) {
      clearTimeout(voiceRetryTimer);
      voiceRetryTimer = null;
    }
    voiceMsg.volume = 1;
    voiceMsg.muted = false;
    voiceMsg.play().then(() => {
      voiceLabel.textContent = '暂停留言';
    }).catch(() => {
      voiceLabel.textContent = '播放我的留言';
    });
  }
  voiceBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (voiceMsg.paused) {
      if (voiceMsg.readyState >= 3) {
        startVoicePlayback();
      } else {
        voiceLabel.textContent = '留言加载中';
        voiceMsg.load();
        voiceMsg.removeEventListener('canplaythrough', startVoicePlayback);
        voiceMsg.addEventListener('canplaythrough', startVoicePlayback, { once: true });
        voiceRetryTimer = setTimeout(() => {
          voiceLabel.textContent = '播放我的留言';
        }, 6000);
      }
    } else {
      voiceMsg.pause();
      voiceLabel.textContent = '播放我的留言';
    }
  });
  voiceMsg.addEventListener('error', () => {
    if (voiceMsg.src.includes('voice-message.mp3')) {
      voiceMsg.src = '录音机-20260806-1534..m4a?v=4';
      voiceMsg.load();
    } else {
      voiceLabel.textContent = '播放我的留言';
      resumeBgmIfNeeded();
    }
  });
  voiceMsg.addEventListener('play', duckBgm);
  voiceMsg.addEventListener('pause', () => {
    voiceLabel.textContent = voiceMsg.ended ? '再听一遍' : '播放我的留言';
    resumeBgmIfNeeded();
  });
  voiceMsg.addEventListener('ended', () => {
    voiceLabel.textContent = '再听一遍';
    resumeBgmIfNeeded();
  });
  const letterEnvelope = document.getElementById('letterEnvelope');
  if (letterEnvelope) {
    letterEnvelope.addEventListener('click', (e) => {
      e.stopPropagation();
      openLetterEnvelope();
    });
  }

  endingHeart.addEventListener('click', (e) => {
    e.stopPropagation();
    heartClickCount += 1;
    if (heartClickCount >= 3) {
      heartClickCount = 0;
      launchEndingFireworks();
    }
    const show = !endingMessage.classList.contains('show');
    endingMessage.classList.toggle('show', show);
    if (endingHint) endingHint.style.opacity = show ? 0 : 1;
  });
  let heartClickCount = 0;
  function fireworkRound(palette, delay) {
    window.setTimeout(() => {
      if (!endingFireworks) return;
      for (let i = 0; i < 36; i++) {
        const p = document.createElement('span');
        p.className = 'burst-p' + (i % 4 === 3 ? ' dot' : '');
        const a = (i / 36) * Math.PI * 2 + Math.random() * 0.3;
        const dist = 140 + Math.random() * 300;
        p.style.setProperty('--tx', `${Math.cos(a) * dist}px`);
        p.style.setProperty('--ty', `${Math.sin(a) * dist}px`);
        p.style.setProperty('--c', palette[i % palette.length]);
        p.style.setProperty('--s', `${12 + Math.random() * 14}px`);
        if (i % 4 !== 3) p.textContent = ['♥', '✦', '✧'][i % 3];
        p.style.animationDelay = `${Math.random() * 0.15}s`;
        endingFireworks.appendChild(p);
        window.setTimeout(() => p.remove(), 1900);
      }
      const ring = document.createElement('span');
      ring.className = 'burst-ring';
      ring.style.setProperty('--c', palette[0]);
      endingFireworks.appendChild(ring);
      window.setTimeout(() => ring.remove(), 1300);
    }, delay);
  }
  function launchEndingFireworks() {
    fireworkRound(['#ffd98a', '#ff8fa3', '#ffb37d', '#fff0d0'], 0);
    fireworkRound(['#ff8fa3', '#ffc3cf', '#ffb37d', '#ffe6a3'], 700);
    fireworkRound(['#ffe6a3', '#ffd98a', '#ffc3cf', '#fff0d0'], 1400);
  }

  musicBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (bgm.paused) {
      if (musicStarted) {
        bgm.play().catch(() => {});
        musicBtn.classList.add('playing');
      } else {
        startMusic();
      }
    } else {
      bgm.pause();
      musicBtn.classList.remove('playing');
    }
  });
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && musicBtn.classList.contains('playing') && bgm.paused) {
      bgm.play().catch(() => {});
    }
  });

  stage.addEventListener('click', (e) => {
    startMusic();
    spawnTapSpark(e.clientX, e.clientY);
    if (performance.now() - gateOpenedAt < 700) return;
    if (e.target.closest('.replay, .photo, .page-arrow, .page-dot')) return;
    if (scene === 0) setScene(1);
    else if (scene === 1) {
      if (!candlesBlown) blowCandles();
      else if (!wishBurstOpen) setScene(2);
    }
    else if (scene === 2) {
      if (!letterOpened) openLetterEnvelope();
      else if (!letterDone) speedUpLetterTyping();
      else setScene(3);
    }
    else if (scene === 3 && photoPage === 0) showPhotoPage(1);
    else if (scene === 3 && photoPage === 1) setScene(4);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeLightbox();
      return;
    }
    if (lightbox.classList.contains('open')) {
      if (e.key === 'ArrowLeft') openLightboxAt(lightboxIndex - 1);
      if (e.key === 'ArrowRight') openLightboxAt(lightboxIndex + 1);
      return;
    }
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      if (scene === 0) setScene(1);
      else if (scene === 1) {
        if (!candlesBlown) blowCandles();
        else if (!wishBurstOpen) setScene(2);
      }
      else if (scene === 2) {
        if (!letterOpened) openLetterEnvelope();
        else if (!letterDone) speedUpLetterTyping();
        else setScene(3);
      }
      else if (scene === 3 && photoPage === 0) showPhotoPage(1);
      else if (scene === 3 && photoPage === 1) setScene(4);
    }
  });
</script>
